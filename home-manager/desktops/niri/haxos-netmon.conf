-- haxOS — dashboard RÉSEAU (coin bas-droite). Alimenté par le script
-- `humanix-netmon` (execpi) : STATISTICS / ROUTING / ACTIVE + UDP connections /
-- LISTENING_PORTS / LAN_DISCOVERY (arp-scan si CAP_NET_RAW, sinon ip neigh + OUI).
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 8.0,
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=11',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    alignment = 'bottom_right',
    gap_x = 30,
    gap_y = 30,
    minimum_width = 700,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${alignr}${color2}[${color1}NET${color2}]${color} ${color2}::${color} humanix-netmon
${execpi 8 humanix-netmon}
]]
