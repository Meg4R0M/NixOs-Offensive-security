-- haxOS (daviddavioblue) — colonne SYSTÈME (fenêtre droite). Le host + gpu/temp/
-- fan/net sont dans la fenêtre gauche (haxos-host.conf). 2 fenêtres car le
-- backend Wayland de conky gère mal 2 colonnes (goto/voffset) dans une fenêtre.
-- Ici escalier ${alignr} uniquement. Matériel : Ryzen AI 7 350 / Radeon 860M,
-- 16 threads. Capteurs par NOM (${hwmon ...}) => reboot-safe.
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 1.0,
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=11',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = true,

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    use_spacer = 'right',

    alignment = 'top_right',
    gap_x = 30,
    gap_y = 20,
    minimum_width = 420,
    maximum_width = 490,
    minimum_height = 630,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${alignr}${offset -60}${voffset -6}${font Robotastic:pixelsize=30}${color}humanix${color2}os${color}${font}
${alignr}${offset -95}${color2}▲${color}
${alignr}${offset 7}${color2}└─────────────┐${color}
${alignr}${color2}│${color}
${alignr}${font Robotastic:pixelsize=12}system${font} ${color2}-─┤${color}
${alignr}${font Robotastic:pixelsize=12}cpu${font} ${color2}-─┤    │${color}
${alignr}${color1}[${color} ${exec grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed -e 's/^ //' -e 's/ w\/.*//'} ${color1}]${color} name ${color2}-─┤    │    │${color}
${alignr}${color1}[${color} ${freq_g 1} GHz ${color1}]${color} clock ${color2}-─┤    │    │${color}
${alignr}${font Robotastic:pixelsize=12}used${font} ${color2}-─┤    │    │${color}
${alignr}${cpugraph cpu0 24,110 1f4d1f ff2b2b}${color2} -─┘    │    │    │${color}
${alignr}${color1}[${color} ${cpu cpu0}% ${color1}]${color} total ${color2}-─┤    │    │${color}
${alignr}${color1}[${color} $loadavg ${color1}]${color} load ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top name 1}  ${top cpu 1}% ${color2}]${color} ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top name 2}  ${top cpu 2}% ${color2}]${color} ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top name 3}  ${top cpu 3}% ${color2}]${color} ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top name 4}  ${top cpu 4}% ${color2}]${color} ${color2}-─┘    │    │${color}
${alignr}${font Robotastic:pixelsize=12}processes${font} ${color2}-─┘    │${color}
${alignr}${color1}[${color} $processes ${color1}]${color}   total ${color2}-─┤         │${color}
${alignr}${color1}[${color} $running_processes ${color1}]${color} running ${color2}-─┘         │${color}
${alignr}${color2}│${color}
${alignr}${font Robotastic:pixelsize=12}resources${font} ${color2}-─┤${color}
${alignr}${color1}[${color} $diskio_read ${color1}]${color}  read ${color2}-─┤    │${color}
${alignr}${color1}[${color} $diskio_write ${color1}]${color} write ${color2}-─┤    │${color}
${alignr}${font Robotastic:pixelsize=12}ram${font} ${color2}-─┤    │${color}
${alignr}${color1}[${color} $memperc% ${color1}]${color} ${font Robotastic:pixelsize=12}used${font} ${color2}-─┤    │    │${color}
${alignr}${color1}[${color} $mem/$memmax ${color1}]${color} ${color2}-─┘    │    │    │${color}
${alignr}${color2}[${color} ${top_mem name 1}  ${top_mem mem 1} ${color2}]${color} ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top_mem name 2}  ${top_mem mem 2} ${color2}]${color} ${color2}-─┤    │    │${color}
${alignr}${color2}[${color} ${top_mem name 3}  ${top_mem mem 3} ${color2}]${color} ${color2}-─┘    │    │${color}
${alignr}${color1}[${color} $swapperc% - $swap/$swapmax ${color1}]${color} ${font Robotastic:pixelsize=12}swap${font} ${color2}-─┤    │${color}
${alignr}${color1}[${color} ${swapbar 12,110} ${color1}]${color} ${color2}-─┘    │    │${color}
${alignr}${color1}[${color} ${fs_used /boot}/${fs_size /boot} ${color1}]${color} ${font Robotastic:pixelsize=12}boot${font} ${color2}-─┤    │${color}
${alignr}${color1}[${color} ${fs_used /}/${fs_size /} ${color1}]${color} ${font Robotastic:pixelsize=12}root${font} ${color2}-─┤    │${color}
${alignr}${color1}[${color} ${fs_used /home}/${fs_size /home} ${color1}]${color} ${font Robotastic:pixelsize=12}home${font} ${color2}-─┘    │${color}
]]
