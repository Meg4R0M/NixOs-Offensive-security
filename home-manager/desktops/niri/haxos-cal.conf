-- Calendrier — à droite de l'horloge (haut-gauche).
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 60.0,
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=14',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    alignment = 'top_left',
    gap_x = 450,   -- décalé à droite : la ligne date de l'horloge débordait dessus
    gap_y = 40,
    minimum_width = 230,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${color1}󰃭${font Robotastic:pixelsize=13} calendrier${font}${color}
${execi 3600 LC_TIME=fr_FR.UTF-8 cal --color=never}
]]
