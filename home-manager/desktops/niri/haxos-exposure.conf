-- haxOS — bloc EXPOSITION PUBLIQUE (haut-gauche, sous l'horloge). Alimenté par
-- `humanix-exposure` (execi) : IP publique + géoloc (ifconfig.co, cache 5 min) +
-- statut VPN + Tor + IP locale. Conscience OPSEC « vu de l'extérieur ».
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 5.0,
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=12',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    -- Sous l'horloge (gap_y 20, ~200px de haut) et sous le calendrier (x360,
    -- ~200px) : gap_y 260 dégage les deux ; largeur 300 reste à gauche du cal.
    alignment = 'top_left',
    gap_x = 40,
    gap_y = 260,
    minimum_width = 330,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${color2}╔═${color}${font Robotastic:pixelsize=13} EXPOSITION ${font}${color2}═════════════════════╗${color}
${execi 15 humanix-exposure}
${color2}╚══════════════════════════════════╝${color}
]]
