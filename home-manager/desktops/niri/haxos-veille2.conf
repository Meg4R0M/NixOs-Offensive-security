-- Veille blogs/presse cybersécurité FR — sous l'horloge (gauche).
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 2.0,
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=13',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    -- Empilé au-dessus de la veille FR (cert-fr, bottom_left gap_y 30). Garde-fou
    -- anti-chevauchement : cert-fr = 11 items max => ~350px de haut ; on place ce
    -- bloc à 30 (base) + ~350 (hauteur cert-fr) + 60 (marge) = 440. Fini le chevauch.
    alignment = 'bottom_left',
    gap_x = 40,
    gap_y = 440,
    minimum_width = 820,
    maximum_width = 860,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${color2}╔══════════════════════════════════════════════════════════════════════════════════════════════════════╗${color}
${color2}║${color}   ${color1}󰖟${font Robotastic:pixelsize=14} Veille blogs / presse${color}  -  cybersecurite (FR)${font}
${color2}╠══════════════════════════════════════════════════════════════════════════════════════════════════════╣${color}
${execpi 1800 veille-blogs}
${color2}╚══════════════════════════════════════════════════════════════════════════════════════════════════════╝${color}
${color1}[UN]${color} UnderNews   ${color1}[JDH]${color} Journal du Hacker   ${color1}[CS]${color} Cyber-Sécurité   ${color2}[DSB]${color} DataBreach
]]
