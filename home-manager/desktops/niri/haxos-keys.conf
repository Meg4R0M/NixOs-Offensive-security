-- haxOS — cheatsheet des raccourcis niri (tableau, fenêtre bas-centre). Contenu
-- STATIQUE généré par gen-keys.py (même dossier ; padding au codepoint) : miroir
-- de la section binds de home-manager/desktops/niri/default.nix — régénérer via
-- `python3 gen-keys.py` si tu changes les binds. Colonnes alignées + règles
-- horizontales (traits verticaux évités : conky les rend en pointillés).
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 3600.0,   -- contenu statique -> refresh minimal
    total_run_times = 0,

    use_xft = true,
    -- JetBrains Mono (pas Victor Mono) : ses box-drawing ═║│╔╣ se RACCORDENT
    -- (traits continus) ; Victor Mono les rend en pointillés. Reste monospace
    -- strict -> l'alignement au codepoint tient.
    font = 'JetBrainsMono Nerd Font Mono:pixelsize=12',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    -- bottom_middle : la fenêtre s'auto-dimensionne au tableau -> centrée. Pas de
    -- alignc (les colonnes s'alignent car chaque ligne part du bord gauche).
    alignment = 'bottom_middle',
    gap_x = 0,
    gap_y = 124,                -- descendu de 50px (174 -> 124)

    default_color = '00b32d',   -- descriptions (vert moyen)
    color1 = '39ff14',          -- touches (vert néon)
    color2 = 'ff2b2b',          -- bordures / séparateurs (rouge fsociety)
}

conky.text = [[
${color2}════════════════════════════════════ [ ${color1}RACCOURCIS NIRI${color2} ] ═════════════════════════════════════${color}
  ${color1}FENÊTRES${color}                        ${color1}NAVIGATION${color}                      ${color1}SYSTÈME${color}                     
${color3}──────────────────────────────────────────────────────────────────────────────────────────────${color}
  ${color1}Mod+↵${color}         ${color}terminal          ${color1}Mod+←→${color}        ${color}focus colonne     ${color1}Impr${color}          ${color}capture écran 
  ${color1}Mod+D${color}         ${color}menu (rofi)       ${color1}Mod+↑↓${color}        ${color}focus fenêtre     ${color1}Mod+Impr${color}      ${color}capture fen.  
  ${color1}Mod+Q${color}         ${color}fermer            ${color1}Mod+Shift+←→${color}  ${color}déplacer col.     ${color1}Mod+Shift+V${color}   ${color}presse-papier 
  ${color1}Mod+F${color}         ${color}plein écran       ${color1}Mod+Shift+↑↓${color}  ${color}déplacer fen.     ${color1}Super+Shift+L${color} ${color}verrouiller   
  ${color1}Mod+Shift+F${color}   ${color}maximiser         ${color1}Mod+Ctrl+←→${color}   ${color}aspirer/éject     ${color1}Mod+Shift+/${color}   ${color}aide niri     
  ${color1}Mod+V${color}         ${color}flottant          ${color1}Mod+W${color}         ${color}vue d'ensemble    ${color1}Mod+K${color}         ${color}clavier écran 
  ${color1}Mod+T${color}         ${color}onglets           ${color1}Mod+Tab${color}       ${color}dernier WS        ${color1}Mod+Shift+R${color}   ${color}rotation      
  ${color1}Mod+C${color}         ${color}centrer           ${color1}Mod+1-9${color}       ${color}aller au WS       ${color1}Mod+Shift+E${color}   ${color}quitter niri  
  ${color1}Mod+R${color}         ${color}largeur           ${color1}Mod+Shift+1-5${color} ${color}envoyer au WS     ${color1}média${color}         ${color}Vol/Muet/Lum  
${color2}══════════════════════════════════════════════════════════════════════════════════════════════${color}
]]
