-- haxOS — cheatsheet des raccourcis niri (fenêtre bas-centre). Contenu statique
-- (miroir de la section binds de home-manager/desktops/niri/default.nix : à
-- tenir à jour si tu changes les binds). Vert phosphore, centré via ${alignc}.
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 3600.0,   -- contenu statique -> refresh minimal
    total_run_times = 0,

    use_xft = true,
    font = 'VictorMono Nerd Font Mono:pixelsize=12',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    alignment = 'bottom_middle',
    gap_x = 0,
    gap_y = 24,
    minimum_width = 980,

    default_color = '00b32d',   -- descriptions (vert moyen)
    color1 = '39ff14',          -- touches (vert néon, ressortent)
    color2 = 'ff2b2b',          -- crochets / séparateurs (rouge fsociety)
}

conky.text = [[
${alignc}${color2}[${color} ${color1}RACCOURCIS NIRI${color} ${color2}]${color}
${alignc}${color1}Mod+↵${color} terminal   ${color1}Mod+D${color} menu   ${color1}Mod+Q${color} fermer   ${color1}Mod+F${color} plein écran   ${color1}Mod+V${color} flottant   ${color1}Mod+R${color} largeur
${alignc}${color1}Mod+←→↑↓${color} focus     ${color1}Mod+Shift+←→↑↓${color} déplacer     ${color1}Mod+1-9${color} workspace     ${color1}Mod+Shift+1-5${color} → workspace
${alignc}${color1}Mod+Impr${color} capture   ${color1}Mod+Shift+V${color} presse-papier   ${color1}Mod+K${color} clavier écran   ${color1}Mod+Shift+R${color} rotation   ${color1}Mod+Shift+E${color} quitter niri
]]
