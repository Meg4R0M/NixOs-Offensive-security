-- haxOS — horloge géante, portée en conky Wayland.
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 1.0,
    total_run_times = 0,

    use_xft = true,
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    alignment = 'top_left',
    gap_x = 40,
    gap_y = 20,
    minimum_width = 320,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${font Robotastic:pixelsize=22}${color2}[ ${color}${time %S}${color2} ]${color}${font}
${voffset -12}${font Robotastic:pixelsize=130}${color1}${time %H}${font}
${voffset -40}${offset 50}${font Robotastic:pixelsize=130}${color2}${time %M}${color}${font}
${voffset 24}${font Robotastic:pixelsize=18}${color}${time %A %d %B %Y}${font}
]]
