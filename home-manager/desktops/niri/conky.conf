-- Conky (backend Wayland) — fond de bureau Mr Robot vert sous Niri.
conky.config = {
    -- Sortie Wayland (surface layer-shell de fond), pas X11.
    out_to_wayland = true,
    out_to_x = false,

    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 130,
    own_window_transparent = false,

    background = true,
    double_buffer = true,
    update_interval = 1.0,

    alignment = 'top_left',
    gap_x = 50,
    gap_y = 60,
    minimum_width = 340,
    maximum_width = 360,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,

    -- Palette CRT verte + accent rouge
    default_color = '00ff41',
    color1 = '39ff14',
    color2 = 'ff2b2b',
    color3 = '1f4d1f',
}

conky.text = [[
${color2}╭─ fsociety@${nodename} ───────────${color}
${color1} SYSTEM${color}
 ${kernel}${alignr}${machine}
 up ${uptime_short}${alignr}load ${loadavg 1}
${color1} CPU ${color}${cpu}%${alignr}${freq_g} GHz
${color3}${cpubar 6}${color}
${color1} RAM ${color}${memperc}%${alignr}${mem} / ${memmax}
${color3}${membar 6}${color}
${color1} DISK ${color}${fs_used_perc /}%${alignr}${fs_used /} / ${fs_size /}
${color3}${fs_bar 6 /}${color}
${color1} NET ${color}${addr wlo1}
   ${downspeedf wlo1} KB/s${alignr} ${upspeedf wlo1} KB/s
${color1} PROC ${color}${alignr}${processes} total
 ${top name 1}${alignr}${top cpu 1}%
 ${top name 2}${alignr}${top cpu 2}%
 ${top name 3}${alignr}${top cpu 3}%
${color2}╰──────────────────────────${color}
${color1}${alignc}${time %H:%M:%S}${color}
${alignc}${time %A %d %B %Y}
]]
