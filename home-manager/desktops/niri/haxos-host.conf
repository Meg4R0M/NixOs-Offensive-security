-- haxOS — colonne GAUCHE (fenêtre séparée) : host + gpu + température + ventilos
-- + réseau. Arbre à branches gauche (├ / └). Fenêtre indépendante top_left =>
-- placement fiable sur Wayland (contrairement à goto/voffset multi-colonnes).
conky.config = {
    out_to_wayland = true,
    out_to_x = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    background = true,
    double_buffer = true,
    update_interval = 1.0,
    total_run_times = 0,

    use_xft = true,
    font = 'JetBrainsMono Nerd Font Mono:pixelsize=11',
    override_utf8_locale = true,
    draw_shades = false,
    draw_outline = false,
    draw_graph_borders = true,

    net_avg_samples = 2,

    -- Colonne host ancrée à DROITE (comme monitor) pour coller les 2 colonnes.
    -- gap_x = marge_monitor(30) + largeur_monitor + petit_espace. À ajuster.
    alignment = 'top_right',
    gap_x = 200,
    gap_y = 96,
    minimum_width = 330,
    minimum_height = 560,

    default_color = '00ff41',
    color1 = '00ff41',
    color2 = 'ff2b2b',
    color3 = '1f6d2f',
}

conky.text = [[
${color2}┌─${color}${font Robotastic:pixelsize=13} ${nodename} ${font}${color2}──────────────${color}
${color2}├${color} ${color1}[${color} ${exec uname -r | cut -c 1-12} ${color1}]${color} kernel
${color2}├${color} ${color1}[${color} $machine ${color1}]${color} arch
${color2}├${color} ${color1}[${color} $uptime ${color1}]${color} uptime
${color2}├${color} ${color1}[${color} ${battery_percent BAT0}% ${color1}]${color} battery
${color2}├${color} ${color1}[${color} ${addr wlo1} ${color1}]${color} ip
${color2}├${color} ${color1}[${color} ${exec cat /sys/class/net/wlo1/address} ${color1}]${color} mac
${color2}└${color} ${color1}[${color} ${execi 10 nmcli -t -f IN-USE,SSID dev wifi | grep '^\*' | cut -d: -f2} ${color2}${execi 10 nmcli -t -f IN-USE,SIGNAL dev wifi | grep '^\*' | cut -d: -f2}% ${color1}]${color} wifi
${voffset 6}${color2}┌─${color}${font Robotastic:pixelsize=13} gpu ${font}${color2}────────────────${color}
${color2}├${color} ${color1}[${color} Radeon 860M ${color1}]${color} name
${color2}├${color} ${color1}[${color} ${exec echo $(($(cat /sys/class/drm/card1/device/mem_info_vram_used)/1048576))}/${exec echo $(($(cat /sys/class/drm/card1/device/mem_info_vram_total)/1048576))} MiB ${color1}]${color} vram
${color2}├${color} ${color1}[${color} ${exec cat /sys/class/drm/card1/device/gpu_busy_percent}% ${color1}]${color} used
${color2}└${color} ${color1}[${color} ${hwmon amdgpu temp 1}°C ${color1}]${color} temp
${voffset 6}${color2}┌─${color}${font Robotastic:pixelsize=13} temperature ${font}${color2}────────${color}
${color2}├${color} ${color1}[${color} ${hwmon k10temp temp 1}°C ${color1}]${color} cpu
${color2}├${color} ${color1}[${color} ${hwmon amdgpu temp 1}°C ${color1}]${color} gpu
${color2}└${color} ${color1}[${color} ${hwmon nvme temp 1}°C ${color1}]${color} nvme
${voffset 6}${color2}┌─${color}${font Robotastic:pixelsize=13} fan-speed ${font}${color2}──────────${color}
${color2}└${color} ${color1}[${color} ${hwmon acpi_fan fan 1} RPM ${color1}]${color} fan
${voffset 6}${color2}┌─${color}${font Robotastic:pixelsize=13} net ${font}${color2}────────────────${color}
${color2}├${color} ${color1}[${color} ${tcp_portmon 1 65535 count} ${color1}]${color} connections
${color2}├${color} ${color1}[${color} ${tcp_portmon 1 32767 count} ${color1}]${color} in / local
${color2}├${color} ${color1}[${color} ${tcp_portmon 32768 61000 count} ${color1}]${color} out / remote
${color2}├${color} ${color1}[${color} ${upspeed wlo1} ${color1}]${color} up
${color2}│${color} ${upspeedgraph wlo1 24,110 1f4d1f ff2b2b}
${color2}├${color} ${color1}[${color} ${downspeed wlo1} ${color1}]${color} down
${color2}└${color} ${downspeedgraph wlo1 24,110 1f4d1f 00ff41}
]]
